name: phase5-final-acceptance-repair

on:
  push:
    branches:
      - ui/phase-5-shared-scientific-context

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/phase-5-shared-scientific-context
          fetch-depth: 0
      - name: Align imported-profile judge assertion with integrated summary
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("frontend/e2e/live.spec.ts")
          text = path.read_text()
          old = '''  await expect(page.locator(".judge-summary")).toContainText("sensor plugin profiles");\n  await revealCanvasTools(page);\n  const importedSelector = page.locator(".imported-observation-chips");'''
          new = '''  // The integrated 140-block judge summary now reports block-field provenance.\n  // Imported-session evidence is verified on its dedicated selector instead of\n  // requiring obsolete summary copy.\n  await revealCanvasTools(page);\n  const importedSelector = page.locator(".imported-observation-chips");\n  await expect(importedSelector).toBeVisible();'''
          if old not in text:
              raise SystemExit("Expected imported-profile assertion block not found")
          path.write_text(text.replace(old, new))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/e2e/live.spec.ts
          git diff --cached --quiet && exit 0
          git commit -m "test: verify imported evidence on its canonical selector"
          git push origin HEAD:ui/phase-5-shared-scientific-context
