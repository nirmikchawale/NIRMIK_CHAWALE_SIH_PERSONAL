# ITM-09 development-only scientific/API validation.
# This branch contains only this workflow. No release, Pages, MPR image or full browser jobs.
name: itm09-exact-source-science-api-focused

on:
  push:
    branches:
      - validation/itm09-science-api-focused-20261027

permissions:
  contents: read

concurrency:
  group: itm09-science-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-source-science:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout immutable ITM-09 science plus Argo candidate
        uses: actions/checkout@v4
        with:
          ref: 244ef43780f21a68c924593bebaeb0a169aa7876
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact SHA, three-file delta and unchanged native CCHDO source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "244ef43780f21a68c924593bebaeb0a169aa7876"
          test -z "$(git status --porcelain)"
          python - <<'PY'
          import subprocess
          parent = "9541eb3a91595ee9cfc62cb7770922925761971e"
          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()
          assert git("rev-parse", "HEAD^") == parent
          changed = set(git("diff", "--name-only", parent, "HEAD").splitlines())
          expected = {
              "frontend/src/App.tsx",
              "frontend/src/components/OceanGlobe.tsx",
              "frontend/e2e/mpr-default-verified-argo-5907092.spec.ts",
          }
          assert changed == expected, (changed, expected)
          scientific_path = "scripts/fetch_verified_observation_breadth.py"
          expected_blob = "7a4f5f5025c59f337b813fc89a854c6205a37b17"
          assert git("rev-parse", f"HEAD:{scientific_path}") == expected_blob
          assert git("rev-parse", f"{parent}:{scientific_path}") == expected_blob
          print("ITM-09 source boundary and immutable CCHDO blob PASS")
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install canonical scientific/API test dependencies
        run: |
          python -m pip install -r requirements.txt -r backend/requirements.txt

      - name: Run focused native-science and FastAPI contracts without provider retries
        run: |
          python -m pytest -q tests/test_m001_m007_scientific_baseline.py backend/tests
          python -m compileall -q backend api scripts/fetch_verified_observation_breadth.py

      - name: Export genuine bundled static science and verify immutable provenance
        shell: bash
        run: |
          set -euo pipefail
          python scripts/export_static_science.py --output /tmp/itm09-science-static
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("/tmp/itm09-science-static")
          def load(path):
              return json.loads((root / path).read_text(encoding="utf-8"))
          manifest, health, catalog = load("manifest.json"), load("health.json"), load("catalog.json")
          assert manifest["schema"] == "oceantwin-static-science-v1"
          assert manifest["time_steps"] == 1
          assert manifest["depth_levels"] == 31
          assert manifest["profiles"] == 2
          assert manifest["scientific_data_network_required_at_runtime"] is False
          assert health["status"] == "ok"
          assert set(health["variables"]) == {"thetao", "so", "uo", "vo"}
          assert catalog["capabilities"]["argo_profiles"] is True
          assert (root / "provenance.json").is_file()
          assert (root / "profiles/index.json").is_file()
          assert (root / "currents-volume/t0.json").is_file()
          assert (root / "telemetry/thetao/t0_d18.json").is_file()
          print("ITM-09 offline static science and provenance PASS; no external-provider attestation claimed")
          PY
