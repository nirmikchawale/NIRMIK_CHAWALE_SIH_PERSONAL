name: 3db14-full-block-capability-audit

on:
  push:
    branches: [3db-14-full-block-capability-audit]
  pull_request:
    paths:
      - "scripts/audit_3db14_capabilities.py"
      - "tests/test_3db14_full_block_capability_audit.py"
      - "frontend/public/main-blocks/capability-audit.json"
      - "frontend/e2e/3db14-full-block-capability-audit.spec.ts"
      - ".github/workflows/3db14-capability-audit.yml"

jobs:
  immutable-source-inventory-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - name: Verify all 41 native payload digests and 140 capability rows
        run: |
          python -m scripts.audit_3db14_capabilities --check
          python -m pytest -q tests/test_3db14_full_block_capability_audit.py tests/test_3db12_performance_lod.py
      - uses: actions/upload-artifact@v4
        with:
          name: 3db14-source-verified-capability-audit
          path: frontend/public/main-blocks/capability-audit.json
      - run: python -m pip install -r backend/requirements.txt
      - run: python scripts/export_static_science.py --output frontend/public/science-static
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run typecheck
      - working-directory: frontend
        env:
          VITE_STATIC_SCIENCE: "true"
        run: npm run build
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start local production preview
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/ocean-preview.log 2>&1 &
          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/ocean-preview.log; exit 1; fi
      - working-directory: frontend
        env:
          OCEANTWIN_LIVE_URL: "http://127.0.0.1:4173/#/explore"
        run: npx playwright test -c playwright.live.config.ts e2e/3db14-full-block-capability-audit.spec.ts
