name: ocean-canvas-build-train-development

# Runs only development checks for the cumulative M008-M095 build train.
# Never publishes artifacts to GitHub Pages, promotes a PR or modifies main.
on:
  pull_request:
    paths:
      - "frontend/src/**"
      - "frontend/e2e/**"
      - "frontend/public/**"
      - "scripts/**"
      - "tests/**"
      - "docs/requirements/M0**"
      - ".github/workflows/build-train-development.yml"

permissions:
  contents: read

jobs:
  phase-development-preview:
    if: ${{ startsWith(github.event.pull_request.head.ref, 'build/m008-m095-') && github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Record exact unmerged development source
        shell: bash
        run: |
          set -euo pipefail
          echo "Build-only HEAD: $(git rev-parse HEAD)"
          echo "PR stays draft; this job never merges, deploys Pages or certifies public main."
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install canonical science source exporter and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest
      - name: M095 build-first evidence inventory (local-only)
        run: python scripts/certify_build_first.py
      - name: Verify immutable source frame and original Argo reference
        run: python -m pytest -q tests/test_m001_m007_scientific_baseline.py
      - name: Export real frozen GLORYS baseline to local-only browser preview
        run: |
          python scripts/export_static_science.py --output frontend/public/science-static
          test -s frontend/public/science-static/manifest.json
          test -s frontend/public/science-static/catalog.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Typecheck and build isolated React/Cesium preview
        working-directory: frontend
        env:
          VITE_STATIC_SCIENCE: 'true'
        run: |
          npm ci
          npm run typecheck
          npm run build
      - name: Install real Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run M008 actual DOM/scientific-evidence browser acceptance
        working-directory: frontend
        env:
          OCEANTWIN_LIVE_URL: http://127.0.0.1:4174
        run: |
          set -euo pipefail
          python3 -m http.server 4174 --bind 127.0.0.1 --directory dist > /tmp/m008-build-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4174/ > /dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/m008-build-preview.log; exit 1; fi
          npx playwright test -c playwright.live.config.ts e2e/m008-browser-recovery-regression.spec.ts e2e/cert03-native-render-journey.spec.ts e2e/m064-m071-native-render.spec.ts e2e/m072-m079-native-time.spec.ts e2e/m080-m087-neutral-glass.spec.ts e2e/m088-m095-hardening.spec.ts
      - name: Retain genuine unmerged browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m008-dev-browser-evidence-${{ github.run_id }}
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: warn
          retention-days: 30
