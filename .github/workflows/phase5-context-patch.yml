name: phase5-context-patch

on:
  push:
    branches:
      - ui/phase-5-shared-scientific-context

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[phase5-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Phase 5.0 branch
        uses: actions/checkout@v4
        with:
          ref: ui/phase-5-shared-scientific-context
          fetch-depth: 0

      - name: Apply controlled context bridge patch
        run: python .github/phase5_context_patch.py

      - name: Remove temporary patch machinery
        run: |
          rm .github/phase5_context_patch.py
          rm .github/workflows/phase5-context-patch.yml

      - name: Commit Phase 5.0 implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add Phase 5.0 shared scientific context bridge [phase5-patched]"
          git push origin HEAD:ui/phase-5-shared-scientific-context
