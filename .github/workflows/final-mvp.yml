name: final-mvp

on:
  push:
    branches:
      - final-mvp-react-cesium-fastapi
      - main
  pull_request:

jobs:
  science-api-and-fallback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install frozen reference and API dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r backend/requirements.txt

      - name: Run frozen Streamlit regression suite
        run: python -m pytest -q tests

      - name: Run FastAPI scientific contract suite
        run: python -m pytest -q backend/tests

      - name: Compile Python application surfaces
        run: python -m compileall -q app.py config.py oceantwin src backend api tests

      - name: Validate hosted API entrypoint against bundled local evidence
        run: |
          python - <<'PY'
          from api.index import app
          assert app.title.startswith("Ocean Canvas API")
          print(app.title)
          PY

      - name: Fetch verified INCOIS multi-time operational snapshot
        run: |
          rm -rf /tmp/oceantwin-operational
          python scripts/fetch_incois_operational.py --output /tmp/oceantwin-operational/incois-argo-10d-vam.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("/tmp/oceantwin-operational/incois-argo-10d-vam.json").read_text())
          assert payload["source"]["provider"] == "INCOIS"
          assert payload["integrity"]["genuine_time_count"] >= 2
          assert payload["integrity"]["genuine_depth_count"] >= 2
          assert payload["integrity"]["synthetic_timestamps"] is False
          assert payload["record_count"] > 0
          print("INCOIS operational evidence verified:", payload["record_count"], "records")
          PY

      - name: Fetch verified INCOIS chlorophyll ocean-colour snapshot
        run: |
          rm -rf /tmp/oceantwin-chlorophyll
          python scripts/fetch_incois_chlorophyll.py --output /tmp/oceantwin-chlorophyll/incois-chlorophyll.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("/tmp/oceantwin-chlorophyll/incois-chlorophyll.json").read_text())
          assert payload["source"]["provider"] == "INCOIS"
          assert payload["source"]["dataset_id"] == "IRS_chlorophyll_datasets"
          assert payload["integrity"]["genuine_time_count"] >= 2
          assert payload["integrity"]["surface_only"] is True
          assert payload["integrity"]["synthetic_timestamps"] is False
          assert payload["integrity"]["synthetic_depths"] is False
          assert payload["integrity"]["source_values_modified"] is False
          assert payload["record_count"] > 0
          assert payload["variable"]["units"] == "mg/m^3"
          print("INCOIS chlorophyll evidence verified:", payload["record_count"], "records")
          PY

      - name: Verify real INCOIS OPeNDAP DAP2 endpoints
        run: |
          rm -rf /tmp/oceantwin-opendap
          python scripts/verify_incois_opendap.py --output /tmp/oceantwin-opendap/opendap-verification.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("/tmp/oceantwin-opendap/opendap-verification.json").read_text())
          assert payload["protocol"] == "OPeNDAP DAP2"
          assert payload["provider"] == "INCOIS"
          assert payload["integrity"]["real_network_endpoints_checked"] is True
          assert payload["integrity"]["placeholder_endpoints"] is False
          assert payload["integrity"]["dataset_count"] >= 2
          assert {item["dataset_id"] for item in payload["sources"]} >= {"incois_argo_10d_VAM", "IRS_chlorophyll_datasets"}
          print("INCOIS OPeNDAP interoperability verified.")
          PY

      - name: Fetch verified Glider CTD BGC observation breadth pack
        run: |
          rm -rf /tmp/oceantwin-observations
          python scripts/fetch_verified_observation_breadth.py --output /tmp/oceantwin-observations/verified-profiles.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("/tmp/oceantwin-observations/verified-profiles.json").read_text())
          assert payload["schema"] == "oceantwin-verified-observation-pack-v1"
          assert payload["integrity"]["synthetic_measurements"] is False
          assert payload["integrity"]["synthetic_timestamps"] is False
          assert set(payload["integrity"]["sensor_types"]) == {"glider", "ctd", "bgc"}
          assert all(payload["integrity"]["sensor_record_counts"][key] > 0 for key in ("glider", "ctd", "bgc"))
          assert payload["record_count"] > 30
          print("Multi-sensor observation evidence verified:", payload["integrity"]["sensor_record_counts"])
          PY

      - name: Export immutable static science fail-safe
        run: |
          rm -rf /tmp/oceantwin-static-science
          python scripts/export_static_science.py --output /tmp/oceantwin-static-science
          test -s /tmp/oceantwin-static-science/manifest.json
          test -s /tmp/oceantwin-static-science/catalog.json
          test -s /tmp/oceantwin-static-science/profiles/index.json
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("/tmp/oceantwin-static-science")
          manifest = json.loads((root / "manifest.json").read_text())
          operational = json.loads(Path("/tmp/oceantwin-operational/incois-argo-10d-vam.json").read_text())
          assert manifest["schema"] == "oceantwin-static-science-v1"
          assert manifest["time_steps"] == 1
          assert manifest["depth_levels"] == 31
          assert manifest["profiles"] == 2
          assert manifest["scientific_data_network_required_at_runtime"] is False
          assert operational["source"]["provider"] == "INCOIS"
          assert operational["integrity"]["genuine_time_count"] >= 2
          assert operational["integrity"]["genuine_depth_count"] >= 2
          expected_files = 5 + manifest["profiles"] + manifest["time_steps"] * (3 + 7 * manifest["depth_levels"])
          assert len(manifest["files"]) == expected_files
          assert (root / "telemetry/thetao/t0_d18.json").is_file()
          assert (root / "telemetry/so/t0_d18.json").is_file()
          assert (root / "anomalies/thetao/t0_d18.json").is_file()
          assert (root / "anomalies/so/t0_d18.json").is_file()
          print("Static science fail-safe verified:", len(manifest["files"]), "payloads")
          PY

      - name: FastAPI startup and evidence smoke test
        shell: bash
        run: |
          set -euo pipefail
          python -m uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 > fastapi-ci.log 2>&1 &
          API_PID=$!
          trap 'kill $API_PID 2>/dev/null || true' EXIT
          healthy=0
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/api/health >/dev/null; then
              healthy=1
              break
            fi
            sleep 1
          done
          if [ "$healthy" -ne 1 ]; then
            cat fastapi-ci.log
            exit 1
          fi
          curl --fail --silent http://127.0.0.1:8000/api/catalog >/dev/null
          curl --fail --silent 'http://127.0.0.1:8000/api/field?variable=thetao&depth_index=0' >/dev/null
          curl --fail --silent 'http://127.0.0.1:8000/api/field?variable=so&depth_index=0' >/dev/null
          curl --fail --silent 'http://127.0.0.1:8000/api/currents?depth_index=0' >/dev/null
          curl --fail --silent 'http://127.0.0.1:8000/api/currents-volume?horizontal_stride=6&depth_stride=1' >/dev/null
          curl --fail --silent 'http://127.0.0.1:8000/api/telemetry?variable=thetao&depth_index=18' >/dev/null
          curl --fail --silent 'http://127.0.0.1:8000/api/anomalies?variable=thetao&depth_index=18' >/dev/null
          curl --fail --silent http://127.0.0.1:8000/api/profiles >/dev/null

      - name: Frozen Streamlit fallback startup smoke test
        shell: bash
        run: |
          set -euo pipefail
          python -m streamlit run app.py --server.headless true --server.port 8501 > streamlit-ci.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID 2>/dev/null || true' EXIT
          healthy=0
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health >/dev/null; then
              healthy=1
              break
            fi
            sleep 1
          done
          if [ "$healthy" -ne 1 ]; then
            cat streamlit-ci.log
            exit 1
          fi

  react-cesium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Typecheck React and Cesium integration
        working-directory: frontend
        run: npm run typecheck

      - name: Build production frontend
        working-directory: frontend
        run: npm run build

      - name: Validate live browser acceptance suite
        working-directory: frontend
        run: npm run e2e:live -- --list


  static-hosted-failsafe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install static export dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Export canonical scientific API as immutable JSON
        run: python scripts/export_static_science.py --output frontend/public/science-static

      - name: Fetch verified INCOIS operational snapshot for hosted build
        run: python scripts/fetch_incois_operational.py --output frontend/public/operational/incois-argo-10d-vam.json

      - name: Fetch verified INCOIS chlorophyll snapshot for hosted build
        run: python scripts/fetch_incois_chlorophyll.py --output frontend/public/operational/incois-chlorophyll.json

      - name: Verify INCOIS OPeNDAP for hosted build
        run: python scripts/verify_incois_opendap.py --output frontend/public/operational/opendap-verification.json

      - name: Fetch verified Glider CTD BGC profiles for hosted build
        run: python scripts/fetch_verified_observation_breadth.py --output frontend/public/observations/verified-profiles.json

      - name: Create browser NetCDF ingestion test fixture
        run: python scripts/create_netcdf_browser_fixture.py --output frontend/public/samples/cf-profile-fixture.nc

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build hosted static fail-safe
        working-directory: frontend
        env:
          VITE_STATIC_SCIENCE: "true"
        run: npm run build

      - name: Diagnose Cesium offline imagery artifact
        run: |
          echo "SOURCE NaturalEarthII:"
          find frontend/node_modules/cesium/Build/Cesium/Assets -path '*NaturalEarthII*' -type f | sort | head -n 20 || true
          echo "BUILT NaturalEarthII:"
          find frontend/dist/cesiumStatic -path '*NaturalEarthII*' -type f | sort | head -n 20 || true
          echo "BUILT Cesium texture directories:"
          find frontend/dist/cesiumStatic/Assets/Textures -maxdepth 2 -type d | sort | head -n 40 || true

      - name: Verify hosted static artifact contract
        run: |
          test -s frontend/dist/index.html
          test -s frontend/dist/science-static/manifest.json
          test -s frontend/dist/science-static/catalog.json
          test -s frontend/dist/science-static/health.json
          test -s frontend/dist/operational/incois-argo-10d-vam.json
          test -s frontend/dist/operational/incois-chlorophyll.json
          test -s frontend/dist/operational/opendap-verification.json
          test -s frontend/dist/observations/verified-profiles.json
          test -s frontend/dist/samples/cf-profile-fixture.nc
          find frontend/dist/assets -maxdepth 1 -name "netcdf4-wasm-*.wasm" -type f -size +0c | grep -q .
          test -s frontend/dist/cesiumStatic/Assets/Textures/NaturalEarthII/0/0/0.jpg
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("frontend/dist/science-static")
          health = json.loads((root / "health.json").read_text())
          catalog = json.loads((root / "catalog.json").read_text())
          manifest = json.loads((root / "manifest.json").read_text())
          observations = json.loads(Path("frontend/dist/observations/verified-profiles.json").read_text())
          assert health["status"] == "ok"
          assert sorted(health["variables"]) == ["so", "thetao", "uo", "vo"]
          assert catalog["capabilities"]["current_vectors"] is True
          assert catalog["capabilities"]["argo_profiles"] is True
          assert manifest["scientific_data_network_required_at_runtime"] is False
          assert set(observations["integrity"]["sensor_types"]) == {"glider", "ctd", "bgc"}
          assert observations["integrity"]["synthetic_measurements"] is False
          assert observations["record_count"] > 30
          assert (root / "fields/thetao/t0_d18.json").is_file()
          assert (root / "fields/so/t0_d18.json").is_file()
          assert (root / "currents/t0_d18.json").is_file()
          assert (root / "currents-volume/t0.json").is_file()
          assert (root / "telemetry/thetao/t0_d18.json").is_file()
          assert (root / "telemetry/so/t0_d18.json").is_file()
          print("Hosted static fail-safe artifact verified.")
          PY

      - name: Serve and smoke-test production static runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 4173 --bind 127.0.0.1 --directory frontend/dist > static-runtime-ci.log 2>&1 &
          STATIC_PID=$!
          trap 'kill $STATIC_PID 2>/dev/null || true' EXIT

          ready=0
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat static-runtime-ci.log
            exit 1
          fi

          python - <<'PY'
          import json
          from urllib.request import urlopen

          base = "http://127.0.0.1:4173"

          def get_bytes(path):
              with urlopen(base + path, timeout=10) as response:
                  assert response.status == 200, (path, response.status)
                  return response.read()

          def get_json(path):
              return json.loads(get_bytes(path).decode("utf-8"))

          index = get_bytes("/").decode("utf-8")
          assert '<div id="root"></div>' in index

          health = get_json("/science-static/health.json")
          catalog = get_json("/science-static/catalog.json")
          thetao = get_json("/science-static/fields/thetao/t0_d18.json")
          salinity = get_json("/science-static/fields/so/t0_d18.json")
          currents = get_json("/science-static/currents/t0_d18.json")
          currents_volume = get_json("/science-static/currents-volume/t0.json")
          telemetry = get_json("/science-static/telemetry/thetao/t0_d18.json")
          anomaly = get_json("/science-static/anomalies/thetao/t0_d18.json")
          profiles = get_json("/science-static/profiles/index.json")
          provenance = get_json("/science-static/provenance.json")
          operational = get_json("/operational/incois-argo-10d-vam.json")
          observations = get_json("/observations/verified-profiles.json")
          chlorophyll = get_json("/operational/incois-chlorophyll.json")
          opendap = get_json("/operational/opendap-verification.json")
          netcdf_fixture = get_bytes("/samples/cf-profile-fixture.nc")
          natural_earth = get_bytes(
              "/cesiumStatic/Assets/Textures/NaturalEarthII/0/0/0.jpg"
          )

          assert health["status"] == "ok"
          assert "GLORYS12V1" in catalog["dataset"]["label"]
          assert thetao["variable"] == "thetao"
          assert salinity["variable"] == "so"
          assert currents["variable"] == "currents"
          assert currents_volume["variable"] == "currents"
          assert len(currents_volume["depths_m"]) == 31
          assert currents_volume["vertical_component_available"] is False
          assert telemetry["variable"] == "thetao"
          assert len(telemetry["depth_stats"]) == 31
          assert len(telemetry["time_stats"]) == 1
          assert telemetry["time_series_available"] is False
          assert anomaly["method"]["absolute_threshold"] == 3.5
          assert anomaly["temporal_screen"]["status"] == "locked"
          assert anomaly["residual_screen"]["flagged_count"] > 0
          assert len(profiles["profiles"]) == 2
          assert provenance["scientific_disclaimer"]
          assert operational["source"]["provider"] == "INCOIS"
          assert operational["integrity"]["genuine_time_count"] >= 2
          assert operational["integrity"]["genuine_depth_count"] >= 2
          assert chlorophyll["source"]["dataset_id"] == "IRS_chlorophyll_datasets"
          assert chlorophyll["integrity"]["genuine_time_count"] >= 2
          assert chlorophyll["integrity"]["surface_only"] is True
          assert chlorophyll["integrity"]["synthetic_depths"] is False
          assert chlorophyll["record_count"] > 0
          assert opendap["protocol"] == "OPeNDAP DAP2"
          assert opendap["integrity"]["real_network_endpoints_checked"] is True
          assert opendap["integrity"]["placeholder_endpoints"] is False
          assert set(observations["integrity"]["sensor_types"]) == {"glider", "ctd", "bgc"}
          assert observations["integrity"]["synthetic_measurements"] is False
          assert observations["integrity"]["runtime_network_required"] is False
          assert netcdf_fixture[:4] == b"\x89HDF"
          assert natural_earth[:2] == b"\xff\xd8"

          print("Production static runtime smoke test passed.")
          PY
      - name: Publish exact verified production artifact for complete browser suite
        uses: actions/upload-artifact@v4
        with:
          name: final-mvp-verified-production-static
          path: frontend/dist
          retention-days: 2
          if-no-files-found: error

  static-browser-acceptance:
    needs: static-hosted-failsafe
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        working-directory: frontend
        run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: final-mvp-verified-production-static
          path: frontend/dist
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run complete production browser suite (shard ${{ matrix.shard }}/4)
        working-directory: frontend
        env:
          OCEANTWIN_LIVE_URL: http://127.0.0.1:4174
        run: |
          set -euo pipefail
          python3 -m http.server 4174 --bind 127.0.0.1 --directory dist > journey-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4174/ > /dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat journey-preview.log; exit 1; fi
          npm run e2e:live -- --shard=${{ matrix.shard }}/4
