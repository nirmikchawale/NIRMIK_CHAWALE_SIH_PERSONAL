name: phase35a-globe-integration-patch

on:
  push:
    branches:
      - ui/phase-35a-globe-water-column-integration
    paths:
      - tools/phase35a_globe_integration_patch.py
      - .github/workflows/phase35a-globe-integration-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: ui/phase-35a-globe-water-column-integration
          fetch-depth: 0

      - name: Apply deterministic integration patch
        run: python tools/phase35a_globe_integration_patch.py

      - name: Commit patched application files
        shell: bash
        run: |
          if git diff --quiet -- frontend/src/components/OceanGlobe.tsx frontend/src/components/WaterColumn3D.tsx frontend/src/main.tsx; then
            echo "No patch changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/OceanGlobe.tsx frontend/src/components/WaterColumn3D.tsx frontend/src/main.tsx
          git commit -m "feat: integrate 140 main blocks into globe and water column"
          git push origin HEAD:ui/phase-35a-globe-water-column-integration
