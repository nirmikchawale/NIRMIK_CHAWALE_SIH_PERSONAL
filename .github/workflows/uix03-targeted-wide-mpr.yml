name: uix03-targeted-wide-mpr-screenshot
on:
  push:
    branches:
      - diagnostic/uix03-wide-mpr16-stabilization-20261020
permissions:
  contents: read
jobs:
  genuine-wide-only:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r backend/requirements.txt
      - run: python scripts/export_static_science.py --output frontend/public/science-static
      - run: python scripts/fetch_incois_operational.py --output frontend/public/operational/incois-argo-10d-vam.json
      - run: python scripts/fetch_incois_chlorophyll.py --output frontend/public/operational/incois-chlorophyll.json
      - run: python scripts/verify_incois_opendap.py --output frontend/public/operational/opendap-verification.json
      - run: python scripts/fetch_verified_observation_breadth.py --output frontend/public/observations/verified-profiles.json
      - run: python scripts/create_netcdf_browser_fixture.py --output frontend/public/samples/cf-profile-fixture.nc
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: frontend
        run: npm ci && npm run typecheck && VITE_STATIC_SCIENCE=true npm run build && npx playwright install --with-deps chromium
      - name: Run only original 16-theme WIDE viewport test with real PNGs, zero retry
        working-directory: frontend
        env:
          OCEANTWIN_LIVE_URL: http://127.0.0.1:4174
        run: |
          set -euo pipefail
          python3 -m http.server 4174 --bind 127.0.0.1 --directory dist > /tmp/uix03-wide-preview.log 2>&1 &
          p=$!
          trap 'kill "$p" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4174/ > /dev/null; then break; fi
            sleep 1
          done
          npx playwright test -c playwright.live.config.ts e2e/mpr-16-all-themes-visual.spec.ts \
            --grep 'wide-desktop' --retries=0 --workers=1 --reporter=list
      - name: Preserve isolated diagnostic screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uix03-targeted-wide-32-png
          path: frontend/test-results
          if-no-files-found: warn
          retention-days: 7
