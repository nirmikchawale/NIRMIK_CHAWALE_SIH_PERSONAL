name: mpr-live-production-acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-mpr03-through-09-public:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact deployed production source
        uses: actions/checkout@v4
        with:
          ref: 43265375ef1c28ab6e94a48e6162f928b1aeb367
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend test dependencies
        working-directory: frontend
        run: npm install
      - name: Install Chromium and dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Assert latest Pages deployment belongs to merged commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          j="$(gh api "repos/$REPO/actions/runs/37819918490/jobs")"
          echo "$j" | jq -e '[.jobs[] | select(.name=="deploy" and .status=="completed" and .conclusion=="success")] | length == 1'
      - name: Verify MPR-03 through MPR-09 against real public HTTPS URL
        working-directory: frontend
        env:
          OCEANTWIN_LIVE_URL: https://nirmikchawale.github.io/NIRMIK_CHAWALE_SIH_PERSONAL/
        run: |
          npx playwright test -c playwright.live.config.ts \
            e2e/mpr-03-workspace-navigation.spec.ts \
            e2e/mpr-04-workspace-mode.spec.ts \
            e2e/mpr-05-feature-directory.spec.ts \
            e2e/mpr-06-ocean-intelligence.spec.ts \
            e2e/mpr-07-active-main-block.spec.ts \
            e2e/mpr-08-evidence-hub.spec.ts \
            e2e/mpr-09-dual-view-navigator.spec.ts
