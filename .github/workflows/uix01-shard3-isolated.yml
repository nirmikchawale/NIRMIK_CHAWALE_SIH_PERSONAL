name: UIX-01 MPR10-11 canonical mobile controls

on:
  push:
    branches:
      - diagnostic/uix01-shard3-browser-contract-20261020

permissions:
  contents: read
  actions: read

jobs:
  isolated-shard3:
    name: Four MPR10-11 mobile controls cases
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        working-directory: frontend
        run: npm ci
      - name: Download byte-identical certified scientific build
        uses: actions/download-artifact@v4
        with:
          name: final-mvp-verified-production-static
          run-id: 39320367264
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: frontend/dist
      - name: Retain byte-identical verified science payload for exact UI build
        run: |
          set -euo pipefail
          for directory in science-static operational observations samples; do
            if test -d "frontend/dist/$directory"; then
              cp -a "frontend/dist/$directory" "frontend/public/$directory"
            fi
          done
      - name: Build exact candidate with one mobile CSS correction
        working-directory: frontend
        env:
          VITE_STATIC_SCIENCE: 'true'
        run: |
          npm run typecheck
          npm run build
      - name: Verify original release candidate built science
        run: |
          set -euo pipefail
          test -s frontend/dist/index.html
          test -s frontend/dist/science-static/catalog.json
          test -s frontend/dist/observations/verified-profiles.json
          echo "Runtime source SHA d2c444fdaaf75c449aeff30bf23904363d47fa05"
      - name: Install genuine headless Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Check four specific MPR10-11 mobile cases without retries
        working-directory: frontend
        env:
          OCEANTWIN_LIVE_URL: http://127.0.0.1:4174
        run: |
          set -euo pipefail
          python3 -m http.server 4174 --bind 127.0.0.1 --directory dist > shard3-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4174/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:4174/ >/dev/null
          npx playwright test -c playwright.live.config.ts \
            e2e/mpr-10-geographic-section.spec.ts \
            e2e/mpr-11-geographic-controls.spec.ts \
            --grep 'MPR-10 real Cesium geographic scene reflows with one original control panel at (320|390)|MPR-11 geographic control groups retain original native controls at (320|390)' \
            --workers=1 --retries=0
      - name: Preserve real failure screenshot and locator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard3-isolated-real-browser-${{ github.run_id }}
          path: |
            frontend/test-results
            frontend/playwright-report
            frontend/shard3-preview.log
          if-no-files-found: warn
          retention-days: 7
