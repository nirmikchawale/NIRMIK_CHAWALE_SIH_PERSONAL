name: phase5-resolve-main-conflicts

on:
  push:
    branches:
      - ui/phase-5-shared-scientific-context

permissions:
  contents: write

jobs:
  resolve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/phase-5-shared-scientific-context
          fetch-depth: 0
      - name: Merge current main and resolve the four bounded conflicts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          if git merge --no-edit origin/main; then
            echo "Current main merged cleanly."
          else
            conflicts="$(git diff --name-only --diff-filter=U | sort)"
            expected="frontend/e2e/journey.spec.ts
          frontend/e2e/live.spec.ts
          frontend/e2e/main-block-globe-integration.spec.ts
          frontend/src/main.tsx"
            if [ "$conflicts" != "$expected" ]; then
              echo "Unexpected conflict set:"
              printf '%s\n' "$conflicts"
              exit 1
            fi

            # PR #123 is newer for the general live acceptance semantics.
            git checkout --theirs -- \
              frontend/e2e/journey.spec.ts \
              frontend/e2e/live.spec.ts \
              frontend/e2e/main-block-globe-integration.spec.ts \
              frontend/src/main.tsx

            python - <<'PY'
          from pathlib import Path

          journey = Path("frontend/e2e/journey.spec.ts")
          text = journey.read_text()
          start = '''  const client = await context.newCDPSession(page);\n  await client.send("Input.dispatchTouchEvent", { type: "touchStart", touchPoints: [{ x: x - 30, y, id: 1 }, { x: x + 30, y, id: 2 }] });'''
          replacement = '''  const client = await context.newCDPSession(page);\n  // The shared desktop Playwright context does not advertise touch hardware.\n  // Enable Chromium touch emulation so CDP touch input reaches the same touch\n  // and pointer paths used by real mobile browsers.\n  await client.send("Emulation.setTouchEmulationEnabled", { enabled: true, maxTouchPoints: 2 });\n  await client.send("Input.dispatchTouchEvent", { type: "touchStart", touchPoints: [{ x: x - 30, y, id: 1 }, { x: x + 30, y, id: 2 }] });'''
          if start not in text:
              raise SystemExit("Journey touch-start anchor missing after taking current main")
          text = text.replace(start, replacement, 1)
          end = '''  await expect.poll(async () => Number(await shell.getAttribute("data-zoom"))).toBeGreaterThan(1);\n  await client.detach();'''
          end_replacement = '''  await expect.poll(async () => Number(await shell.getAttribute("data-zoom"))).toBeGreaterThan(1);\n  await client.send("Emulation.setTouchEmulationEnabled", { enabled: false });\n  await client.detach();'''
          if end not in text:
              raise SystemExit("Journey touch-end anchor missing after taking current main")
          journey.write_text(text.replace(end, end_replacement, 1))

          main = Path("frontend/src/main.tsx")
          main_text = main.read_text()
          anchor = 'import "./phase35a-live-acceptance.css";\n'
          phase5 = 'import "./phase5-context-bridge.css";\nimport "./phase5-integration-gate.css";\n'
          if anchor not in main_text:
              raise SystemExit("PR #123 stylesheet import missing from current main")
          if 'phase5-context-bridge.css' not in main_text:
              main_text = main_text.replace(anchor, anchor + phase5, 1)
          main.write_text(main_text)
          PY

            git add \
              frontend/e2e/journey.spec.ts \
              frontend/e2e/live.spec.ts \
              frontend/e2e/main-block-globe-integration.spec.ts \
              frontend/src/main.tsx
            git commit --no-edit
          fi

          # Temporary reconciliation workflows must never become part of the PR.
          rm -f .github/workflows/phase5-reconcile-main.yml
          rm -f .github/workflows/phase5-resolve-main-conflicts.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove Phase 5 reconciliation helpers"
          fi
          git push origin HEAD:ui/phase-5-shared-scientific-context
