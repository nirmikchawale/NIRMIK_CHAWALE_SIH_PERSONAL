name: ocean-canvas-cert02-local-api-build

# Certifies original, bundled science without production deployment.
on:
  pull_request:
    paths:
      - ".github/workflows/cert02-local-api-build.yml"
      - "backend/**"
      - "frontend/**"
      - "api/**"
      - "scripts/**"
      - "src/**"
      - "tests/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-science-api-and-fallback:
    if: ${{ startsWith(github.event.pull_request.head.ref || github.ref_name, 'build/m008-m095-') && (github.event_name != 'pull_request' || github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Pin exact unmerged source
        run: echo "CERT02_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install original API and Streamlit dependencies
        run: python -m pip install -r requirements.txt -r backend/requirements.txt
      - name: Run frozen source, FastAPI and OGC tests
        run: |
          python scripts/certify_build_first.py
          python -m pytest -q tests backend/tests
          python -m compileall -q app.py config.py oceantwin src backend api tests
      - name: Verify hosted FastAPI import without remote staging
        run: |
          python - <<'PY'
          from api.index import app
          assert app.title == "Ocean Canvas API"
          print("Verified local original-source hosted API import")
          PY
      - name: Actual Uvicorn HTTP scientific API contract
        shell: bash
        run: |
          set -euo pipefail
          python -m uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 > /tmp/cert02-uvicorn.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null; then break; fi
            sleep 1
          done
          python - <<'PY'
          from urllib.request import urlopen
          import json
          base="http://127.0.0.1:8000"
          def fetch(path):
              with urlopen(base+path,timeout=30) as r:
                  assert r.status==200
                  return r.read()
          health=json.loads(fetch("/api/health"))
          assert health["status"]=="ok" and health["scientific_data_network_required"] is False
          assert health["time_steps"]==1 and health["depth_levels"]==31
          cat=json.loads(fetch("/api/catalog"))
          assert cat["capabilities"]["time_animation"] is False
          cv=json.loads(fetch("/api/currents-volume?depth_stride=1&horizontal_stride=6"))
          assert cv["components"]==["uo","vo"] and cv["vertical_component_available"] is False
          assert len(cv["depths_m"])==31
          for path in ("/api/connectors","/api/field?variable=thetao&depth_index=18",
              "/api/field?variable=so&depth_index=18","/api/currents?depth_index=18",
              "/api/telemetry?variable=thetao&depth_index=18",
              "/api/anomalies?variable=thetao&depth_index=18",
              "/api/profiles","/api/provenance"):
              json.loads(fetch(path))
          wms=fetch("/ogc/wms?service=WMS&request=GetMap&version=1.3.0&layers=thetao&crs=CRS:84&bbox=67,12,70,14&width=120&height=90&format=image/png&depth_index=18")
          assert wms.startswith(bytes([137,80,78,71,13,10,26,10]))
          print("CERT02 Uvicorn health/catalog/fields/currents/profiles/WMS HTTP PASS")
          PY
      - name: Export and SHA-verify every original science static JSON
        shell: bash
        run: |
          python scripts/export_static_science.py --output frontend/public/science-static
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path("frontend/public/science-static")
          m=json.loads((root/"manifest.json").read_text())
          assert m["time_steps"]==1 and m["depth_levels"]==31 and m["profiles"]==2
          assert not m["scientific_data_network_required_at_runtime"]
          assert len(m["files"])==5+2+(3+7*31)
          for entry in m["files"]:
              p=root/entry["path"]
              assert p.is_file() and p.stat().st_size==entry["bytes"]
              assert hashlib.sha256(p.read_bytes()).hexdigest()==entry["sha256"]
          print("CERT02",len(m["files"]),"original-data science exports verified")
          PY
      - name: Actual frozen Streamlit local server health
        shell: bash
        run: |
          set -euo pipefail
          python -m streamlit run app.py --server.headless true --server.port 8501 >/tmp/cert02-streamlit.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ok=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8501/_stcore/health >/dev/null; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" -ne 1 ]; then cat /tmp/cert02-streamlit.log; exit 1; fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Exact lockfile React/Cesium and fallback build
        working-directory: frontend
        env:
          VITE_STATIC_SCIENCE: 'true'
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm run e2e:live -- --list
      - name: Verify bundled Cesium, WASM, source-backed HTTP static fallback
        shell: bash
        run: |
          set -euo pipefail
          test -s frontend/dist/index.html
          test -s frontend/dist/science-static/health.json
          test -s frontend/dist/science-static/currents-volume/t0.json
          test -s frontend/dist/science-static/profiles/index.json
          test -s frontend/dist/cesiumStatic/Assets/Textures/NaturalEarthII/0/0/0.jpg
          find frontend/dist/assets -name 'netcdf4-wasm-*.wasm' -type f -size +0c | grep -q .
          python -m http.server 4174 --bind 127.0.0.1 --directory frontend/dist >/tmp/cert02-static.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4174/ >/dev/null; then break; fi
            sleep 1
          done
          python - <<'PY'
          from urllib.request import urlopen
          import json
          base="http://127.0.0.1:4174"
          def read(p):
              with urlopen(base+p,timeout=20) as r:
                  assert r.status==200
                  return r.read()
          assert b'id="root"' in read("/")
          assert json.loads(read("/science-static/health.json"))["status"]=="ok"
          assert json.loads(read("/science-static/catalog.json"))["capabilities"]["time_animation"] is False
          volume=json.loads(read("/science-static/currents-volume/t0.json"))
          assert volume["vertical_component_available"] is False
          assert len(volume["depths_m"])==31
          assert len(read("/cesiumStatic/Assets/Textures/NaturalEarthII/0/0/0.jpg"))>500
          print("CERT02 real built-static HTTP fallback PASS")
          PY
      - name: Exact source unchanged and only locally certified
        run: |
          test "$(git rev-parse HEAD)" = "$CERT02_SHA"
          echo "CERT-02 locally certified, NO production merge/deploy"
