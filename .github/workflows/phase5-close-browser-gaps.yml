name: phase5-close-browser-gaps

on:
  push:
    branches:
      - ui/phase-5-shared-scientific-context

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/phase-5-shared-scientific-context
          fetch-depth: 0

      - name: Apply bounded production and acceptance repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          water_path = Path('frontend/src/components/WaterColumn3D.tsx')
          water = water_path.read_text()
          insertion_point = '  const smoothWaterZoomTo = (targetZoom: number) => {'
          native_touch = '''  // Native non-passive touch handling complements the pointer path. Chromium
          // automation and some mobile WebViews can dispatch a real TouchEvent stream
          // without two usable PointerEvents, so the scientific camera must accept both.
          useEffect(() => {
            const canvas = canvasRef.current;
            if (!canvas) return;

            let nativePinchDistance: number | null = null;
            const distanceOf = (touches: TouchList) => {
              if (touches.length < 2) return null;
              const a = touches[0];
              const b = touches[1];
              return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
            };

            const handleTouchStart = (event: TouchEvent) => {
              const distance = distanceOf(event.touches);
              if (distance == null) return;
              event.preventDefault();
              touchPinchActiveRef.current = true;
              if (zoomAnimationRef.current != null) window.cancelAnimationFrame(zoomAnimationRef.current);
              zoomAnimationRef.current = null;
              nativePinchDistance = distance;
              pinchDistanceRef.current = distance;
              setHover(null);
            };

            const handleTouchMove = (event: TouchEvent) => {
              const distance = distanceOf(event.touches);
              if (distance == null) return;
              event.preventDefault();
              touchPinchActiveRef.current = true;
              const previous = nativePinchDistance ?? pinchDistanceRef.current;
              if (previous && distance > 0) {
                setOrbit((current) => ({
                  ...current,
                  zoom: clamp(current.zoom * distance / previous, 0.62, 1.9)
                }));
              }
              nativePinchDistance = distance;
              pinchDistanceRef.current = distance;
            };

            const handleTouchEnd = (event: TouchEvent) => {
              const distance = distanceOf(event.touches);
              if (distance == null) {
                touchPinchActiveRef.current = false;
                nativePinchDistance = null;
                pinchDistanceRef.current = null;
                return;
              }
              nativePinchDistance = distance;
              pinchDistanceRef.current = distance;
            };

            canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
            canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
            canvas.addEventListener('touchend', handleTouchEnd, { passive: false });
            canvas.addEventListener('touchcancel', handleTouchEnd, { passive: false });

            return () => {
              canvas.removeEventListener('touchstart', handleTouchStart);
              canvas.removeEventListener('touchmove', handleTouchMove);
              canvas.removeEventListener('touchend', handleTouchEnd);
              canvas.removeEventListener('touchcancel', handleTouchEnd);
            };
          }, [activeMainBlockId, volume, currentsVolume]);

          '''
          if 'Native non-passive touch handling complements the pointer path' not in water:
              if insertion_point not in water:
                  raise SystemExit('WaterColumn zoom insertion point not found')
              water = water.replace(insertion_point, native_touch + insertion_point, 1)
              water_path.write_text(water)

          css_path = Path('frontend/src/phase5-integration-gate.css')
          css_path.write_text('''/* Phase 5.0 integration-gate fixes. */
          .main-block-globe-hud[data-intro-ready="false"] {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
          }

          /* The globe shell is a two-row grid. Own row 1 directly so the block HUD
             can never drift into the variable-height renderer toolbar in row 2. */
          .station-workspace .main-block-globe-hud {
            position: relative;
            grid-row: 1;
            grid-column: 1;
            align-self: start;
            justify-self: end;
            top: auto;
            right: auto;
            bottom: auto;
            left: auto;
            margin: 12px;
            width: min(320px, calc(100% - 24px));
            max-width: calc(100% - 24px);
            max-height: min(210px, calc(100% - 24px));
            overflow: auto;
            overscroll-behavior: contain;
            z-index: 20;
          }

          .station-workspace .renderer-tools {
            position: relative;
            z-index: 30;
          }

          .ocean-workbench .ocean-journey,
          .ocean-workbench .field-entry-actions {
            z-index: 32;
          }

          .ocean-workbench .water-column-canvas {
            touch-action: none;
          }

          @media (max-width: 760px) {
            .ocean-workbench .station-workspace .mobile-explore-tray,
            .ocean-workbench .station-workspace .mobile-sheet-backdrop {
              display: none !important;
              pointer-events: none !important;
            }

            body:has(.ocean-workbench[data-page="explore"]) .phase35-block-launcher,
            body:has(.ocean-workbench[data-page="explore"]) .phase3-atlas-launcher {
              display: none !important;
              pointer-events: none !important;
            }

            .station-workspace .main-block-globe-hud {
              margin: 10px;
              width: calc(100% - 20px);
              max-width: calc(100% - 20px);
              max-height: min(176px, calc(100% - 20px));
              padding: 9px;
            }
          }

          @media (max-width: 430px) {
            .station-workspace .main-block-globe-hud {
              max-height: min(158px, calc(100% - 20px));
            }
          }
          ''')

          live_path = Path('frontend/e2e/live.spec.ts')
          live = live_path.read_text()
          obsolete = '  await expect(anomalyPage.locator(".anomaly-flag-map svg")).toBeVisible();'
          replacement = '''  // Phase 5 inherits Telemetry's selected salinity/depth context. That exact
          // scientific slice may truthfully have zero threshold crossings, so accept the
          // real spatial map or the explicit zero-flag evidence state.
          await expect(anomalyPage).toHaveAttribute("data-variable", "so");
          const spatialState = anomalyPage.locator(".anomaly-context-card").locator(".anomaly-flag-map svg, .anomaly-empty");
          await expect(spatialState).toBeVisible();
          const spatialEmpty = anomalyPage.locator(".anomaly-context-card .anomaly-empty");
          if (await spatialEmpty.isVisible()) {
            await expect(spatialEmpty).toContainText("No flagged model cells at this depth");
          }'''
          if 'scientific slice may truthfully have zero threshold crossings' not in live:
              if obsolete not in live:
                  raise SystemExit('Obsolete anomaly map assertion not found')
              live = live.replace(obsolete, replacement, 1)
              live_path.write_text(live)
          PY

          git config user.name "CAPTAIN NIRMIK"
          git config user.email "nirmikchawale1@gmail.com"
          git add frontend/src/components/WaterColumn3D.tsx frontend/src/phase5-integration-gate.css frontend/e2e/live.spec.ts
          if git diff --cached --quiet; then
            echo "Browser-gap repairs are already present."
            exit 0
          fi
          git commit -m "fix: close Phase 5 browser acceptance gaps"
          git push origin HEAD:ui/phase-5-shared-scientific-context
