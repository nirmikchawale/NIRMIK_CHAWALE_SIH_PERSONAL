name: x69-promote-saved-scientific-evidence

on:
  push:
    branches:
      - science/x69-parallel-genuine-source-20261023
    paths:
      - .github/workflows/x69-promote-saved-evidence.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: x69-original-evidence-promotion
  cancel-in-progress: false

jobs:
  promote-saved-ten-shards:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout isolated scientific branch
        uses: actions/checkout@v4
        with:
          ref: science/x69-parallel-genuine-source-20261023
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pin acquisition source script to original source-verified bytes
        run: |
          test "$(git hash-object scripts/materialize_x69_parallel.py)" = cd56ce0fdd7a1bd313fdae19bb31b575d12fdd5c
          echo "Scientific acquisition implementation exactly unchanged since the 10 source-validated artifacts."
      - name: Install original promotion helper's real runtime dependencies
        run: python -m pip install "numpy>=2.2,<3" "xarray>=2025.1,<2027" "netCDF4>=1.7,<2" "pytest>=8,<10"
      - name: Verify pre-promotion canonical inventory and exact 69-target mapping
        run: |
          python -m pytest -q tests/test_x69_parallel.py
          python scripts/materialize_x69_parallel.py --plan
      - name: Reuse all ten existing original source-validated artifact batches
        uses: actions/download-artifact@v4
        with:
          run-id: 39883624747
          github-token: ${{ github.token }}
          pattern: x69-verified-shard-*
          path: x69-staged/data
          merge-multiple: true
      - name: Validate all original source bytes and promote only on this branch
        run: |
          python scripts/materialize_x69_parallel.py --promote --staging x69-staged
          python scripts/materialize_x69_parallel.py --verify
          python scripts/main_block_materialization.py verify
          python scripts/audit_3db14_capabilities.py --check
      - name: Atomic branch-only commit of 69 genuine scientific frames
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/main-blocks/manifest.json \
            frontend/public/main-blocks/capability-audit.json \
            frontend/public/main-blocks/data \
            frontend/src/main-block-runtime.ts
          git diff --cached --check
          git diff --cached --quiet && { echo "No new evidence unexpectedly available"; exit 1; }
          git commit -m "data(x69): register 69 source-validated GLORYS blocks for gated review"
          git push origin HEAD:science/x69-parallel-genuine-source-20261023
          echo "Scientific evidence on review branch only. No public merge/deploy/certification."
