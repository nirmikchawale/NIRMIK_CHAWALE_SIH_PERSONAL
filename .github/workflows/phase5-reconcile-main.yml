name: phase5-reconcile-main

on:
  push:
    branches:
      - ui/phase-5-shared-scientific-context

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/phase-5-shared-scientific-context
          fetch-depth: 0
      - name: Merge current main without choosing conflict sides automatically
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          git push origin HEAD:ui/phase-5-shared-scientific-context
