name: UIX-01 cold-reload Cesium readiness gate

# Diagnostic only. No full sharded suite, MPR certificate, or screenshots.
on:
  push:
    branches:
      - diagnostic/uix01-shard1-legacy-contract-20261020

permissions:
  contents: read
  actions: read

jobs:
  diagnose-known-shard1:
    name: Genuine Earth-to-India refresh sequence
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install browser tests
        working-directory: frontend
        run: npm ci
      - name: Reuse precise release candidate built scientific frontend
        uses: actions/download-artifact@v4
        with:
          name: final-mvp-verified-production-static
          run-id: 39320367264
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: frontend/dist
      - name: Confirm released build presence
        run: |
          set -euo pipefail
          test -s frontend/dist/index.html
          test -s frontend/dist/science-static/catalog.json
          test -s frontend/dist/observations/verified-profiles.json
          echo "Real production build is from d2c444fdaaf75c449aeff30bf23904363d47fa05"
      - name: Install real Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Test actual post-ready Earth India ocean refresh without retries
        working-directory: frontend
        env:
          OCEANTWIN_LIVE_URL: http://127.0.0.1:4174
        run: |
          set -euo pipefail
          python3 -m http.server 4174 --bind 127.0.0.1 --directory dist > diag-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4174/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:4174/ >/dev/null
          npx playwright test -c playwright.live.config.ts \
            e2e/3db05-geographic-water-column-sync.spec.ts \
            e2e/journey.spec.ts \
            e2e/live.spec.ts \
            --grep 'fresh refresh replays the Earth India ocean orientation' \
            --workers=1 --retries=0
      - name: Archive exact browser error contexts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard1-isolation-${{ github.run_id }}
          path: |
            frontend/test-results
            frontend/playwright-report
            frontend/diag-preview.log
          if-no-files-found: warn
          retention-days: 7
