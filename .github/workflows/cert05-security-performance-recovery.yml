name: ocean-canvas-cert05-security-performance-recovery
on:
  pull_request:
    paths:
      - ".github/workflows/cert05-security-performance-recovery.yml"
      - "frontend/src/**"
      - "frontend/e2e/cert05-*"
      - "frontend/package-lock.json"
      - "backend/**"
      - "tests/**"
      - "scripts/**"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cert05-stage-a-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true
jobs:
  actual-native-security-performance-and-recovery:
    if: ${{ startsWith(github.event.pull_request.head.ref || github.ref_name, 'build/m008-m095-') && (github.event_name != 'pull_request' || github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Pin exact unmerged original scientific source
        run: |
          echo "CERT05_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          echo "Draft-only CI: no production merge or deployment."
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Original source SHA, Python backend/OGC tests and genuine static exporter
        run: |
          python -m pip install -r requirements.txt -r backend/requirements.txt
          python scripts/certify_build_first.py
          python -m pytest -q tests backend/tests
          python scripts/export_static_science.py --output frontend/public/science-static
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Lockfile React/Cesium types and original static science build
        working-directory: frontend
        env:
          VITE_STATIC_SCIENCE: 'true'
        run: |
          npm ci
          npm run typecheck
          npm run build
      - name: Audit known runtime dependency vulnerabilities fail-closed
        working-directory: frontend
        shell: bash
        run: |
          set -uo pipefail
          npm audit --omit=dev --json >/tmp/cert05-npm-audit.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("/tmp/cert05-npm-audit.json").read_text())
          if data.get("error"):
              raise SystemExit("npm audit service failure, not a security pass: "+str(data["error"]))
          v=data.get("metadata",{}).get("vulnerabilities",{})
          assert "high" in v and "critical" in v, "Dependency audit summary unavailable"
          print("CERT05 actual runtime vulnerability inventory:",v)
          assert v["high"]==0 and v["critical"]==0, "High/critical runtime advisories must be fixed"
          PY
      - name: Install actual Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Real WebGL browser fail-closed, resource timing and native LOD acceptance
        working-directory: frontend
        env:
          OCEANTWIN_LIVE_URL: http://127.0.0.1:4174
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4174 --bind 127.0.0.1 --directory dist >/tmp/cert05-preview.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:4174/science-static/catalog.json >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4174/main-blocks/manifest.json >/dev/null
          npx playwright test -c playwright.live.config.ts e2e/cert05-performance-security-recovery.spec.ts e2e/m088-m095-hardening.spec.ts e2e/3db12-performance-lod.spec.ts
      - name: Verify actual resource evidence and no invented GPU measurements
        working-directory: frontend
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          data=json.loads(Path("certification-evidence/cert05/performance.json").read_text())
          assert data["realBrowser"] and data["elapsedToBothVerifiedMs"]>0
          assert len(data["observedResources"]["originalFrameResources"])>0
          assert data["gpuMeasured"] is False and data["gpuTimings"]=="UNMEASURED"
          print("CERT05 real browser measured",data["elapsedToBothVerifiedMs"],"ms; GPU UNMEASURED")
          PY
      - name: Verify unchanged exact SHA
        run: test "$(git rev-parse HEAD)" = "$CERT05_SHA"
      - name: Retain truthful native performance/browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cert05-stage-a-real-recovery-perf
          path: |
            frontend/certification-evidence/cert05/
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: warn
          retention-days: 30
