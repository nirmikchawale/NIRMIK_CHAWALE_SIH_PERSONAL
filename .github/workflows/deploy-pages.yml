name: deploy-oceantwin-pages
# Pages is enabled; this workflow publishes the verified static fail-safe build.

on:
  push:
    branches:
      - final-mvp-react-cesium-fastapi
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: oceantwin-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Last good deployment, used only if a live data fetch fails (see scripts/restore_last_deployed.sh).
      LAST_GOOD_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - name: Checkout verified branch
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install scientific export dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Export canonical scientific API as static evidence
        run: python scripts/export_static_science.py --output frontend/public/science-static

      - name: Fetch verified INCOIS multi-time operational snapshot
        run: |
          python scripts/fetch_incois_operational.py --output frontend/public/operational/incois-argo-10d-vam.json \
            || bash scripts/restore_last_deployed.sh operational/incois-argo-10d-vam.json frontend/public/operational/incois-argo-10d-vam.json

      - name: Fetch verified INCOIS chlorophyll ocean-colour snapshot
        run: |
          python scripts/fetch_incois_chlorophyll.py --output frontend/public/operational/incois-chlorophyll.json \
            || bash scripts/restore_last_deployed.sh operational/incois-chlorophyll.json frontend/public/operational/incois-chlorophyll.json

      - name: Verify INCOIS OPeNDAP DAP2 endpoints
        run: |
          python scripts/verify_incois_opendap.py --output frontend/public/operational/opendap-verification.json \
            || bash scripts/restore_last_deployed.sh operational/opendap-verification.json frontend/public/operational/opendap-verification.json

      - name: Fetch verified Glider CTD BGC observation profiles
        run: |
          timeout 120s python scripts/fetch_verified_observation_breadth.py --output frontend/public/observations/verified-profiles.json \
            || bash scripts/restore_last_deployed.sh observations/verified-profiles.json frontend/public/observations/verified-profiles.json

      - name: Create browser NetCDF ingestion test fixture
        run: python scripts/create_netcdf_browser_fixture.py --output frontend/public/samples/cf-profile-fixture.nc

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Typecheck judge-facing application
        working-directory: frontend
        run: npm run typecheck

      - name: Build static production application
        working-directory: frontend
        env:
          VITE_STATIC_SCIENCE: "true"
        run: npm run build

      - name: Verify deployment artifact
        run: |
          test -s frontend/dist/index.html
          test -s frontend/dist/science-static/manifest.json
          test -s frontend/dist/science-static/catalog.json
          test -s frontend/dist/science-static/profiles/index.json
          test -s frontend/dist/science-static/anomalies/thetao/t0_d18.json
          test -s frontend/dist/science-static/currents-volume/t0.json
          test -s frontend/dist/science-static/anomalies/so/t0_d18.json
          test -s frontend/dist/operational/incois-argo-10d-vam.json
          test -s frontend/dist/operational/incois-chlorophyll.json
          test -s frontend/dist/operational/opendap-verification.json
          test -s frontend/dist/observations/verified-profiles.json
          test -s frontend/dist/samples/cf-profile-fixture.nc
          find frontend/dist/assets -maxdepth 1 -name "netcdf4-wasm-*.wasm" -type f -size +0c | grep -q .
          test -s frontend/dist/cesiumStatic/Assets/Textures/NaturalEarthII/0/0/0.jpg

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Ocean Canvas to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-public:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout browser acceptance suite
        uses: actions/checkout@v4

      - name: Setup Node for live browser verification
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install browser test dependencies
        working-directory: frontend
        run: npm install

      - name: Install Chromium for Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Verify live Ocean Canvas HTTPS deployment
        shell: bash
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          BASE="${PAGE_URL%/}"

          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent --show-error "${BASE}/" -o /tmp/oceantwin-index.html; then
              ready=1
              break
            fi
            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            echo "Published Pages site did not become reachable."
            exit 1
          fi

          grep -q 'Ocean Canvas' /tmp/oceantwin-index.html

          python - <<'PY'
          import json
          import os
          import time
          from urllib.error import URLError
          from urllib.request import urlopen

          base = os.environ["PAGE_URL"].rstrip("/")

          def get_bytes(path):
              last_error = None
              for attempt in range(1, 11):
                  try:
                      with urlopen(base + path, timeout=20) as response:
                          assert response.status == 200, (path, response.status)
                          return response.read()
                  except (URLError, ConnectionResetError, TimeoutError, OSError) as exc:
                      last_error = exc
                      if attempt == 10:
                          break
                      time.sleep(2)
              raise RuntimeError(f"Failed to fetch {path} after 10 attempts: {last_error}")

          def get_json(path):
              return json.loads(get_bytes(path).decode("utf-8"))

          health = get_json("/science-static/health.json")
          catalog = get_json("/science-static/catalog.json")
          thetao = get_json("/science-static/fields/thetao/t0_d18.json")
          salinity = get_json("/science-static/fields/so/t0_d18.json")
          currents = get_json("/science-static/currents/t0_d18.json")
          currents_volume = get_json("/science-static/currents-volume/t0.json")
          anomaly = get_json("/science-static/anomalies/thetao/t0_d18.json")
          profiles = get_json("/science-static/profiles/index.json")
          provenance = get_json("/science-static/provenance.json")
          operational = get_json("/operational/incois-argo-10d-vam.json")
          chlorophyll = get_json("/operational/incois-chlorophyll.json")
          opendap = get_json("/operational/opendap-verification.json")
          observations = get_json("/observations/verified-profiles.json")
          earth = get_bytes("/cesiumStatic/Assets/Textures/NaturalEarthII/0/0/0.jpg")

          assert health["status"] == "ok"
          assert "GLORYS12V1" in catalog["dataset"]["label"]
          assert thetao["variable"] == "thetao"
          assert salinity["variable"] == "so"
          assert currents["variable"] == "currents"
          assert len(currents_volume["depths_m"]) == 31
          assert currents_volume["vertical_component_available"] is False
          assert anomaly["method"]["absolute_threshold"] == 3.5
          assert anomaly["temporal_screen"]["status"] == "locked"
          assert anomaly["residual_screen"]["flagged_count"] > 0
          assert len(profiles["profiles"]) == 2
          assert provenance["scientific_disclaimer"]
          assert operational["source"]["provider"] == "INCOIS"
          assert operational["integrity"]["genuine_time_count"] >= 2
          assert operational["integrity"]["genuine_depth_count"] >= 2
          assert operational["integrity"]["synthetic_timestamps"] is False
          assert operational["record_count"] > 0
          assert chlorophyll["source"]["provider"] == "INCOIS"
          assert chlorophyll["source"]["dataset_id"] == "IRS_chlorophyll_datasets"
          assert chlorophyll["integrity"]["genuine_time_count"] >= 2
          assert chlorophyll["integrity"]["surface_only"] is True
          assert chlorophyll["integrity"]["synthetic_timestamps"] is False
          assert chlorophyll["integrity"]["synthetic_depths"] is False
          assert chlorophyll["record_count"] > 0
          assert chlorophyll["variable"]["units"] == "mg/m^3"
          assert opendap["protocol"] == "OPeNDAP DAP2"
          assert opendap["provider"] == "INCOIS"
          assert opendap["integrity"]["real_network_endpoints_checked"] is True
          assert opendap["integrity"]["placeholder_endpoints"] is False
          assert opendap["integrity"]["dataset_count"] >= 2
          assert set(observations["integrity"]["sensor_types"]) == {"glider", "ctd", "bgc"}
          assert observations["integrity"]["synthetic_measurements"] is False
          assert observations["integrity"]["synthetic_timestamps"] is False
          assert all(observations["integrity"]["sensor_record_counts"][key] > 0 for key in ("glider", "ctd", "bgc"))
          assert observations["record_count"] > 30
          assert earth[:2] == b"\xff\xd8"

          print("Live Ocean Canvas Pages deployment verified:", base)
          PY

      - name: Run live Chromium judge-flow acceptance test
        working-directory: frontend
        env:
          OCEANTWIN_LIVE_URL: ${{ needs.deploy.outputs.page_url }}
        run: npm run e2e:live
