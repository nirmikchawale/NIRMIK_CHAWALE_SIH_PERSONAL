name: ocean-canvas-itm05-15-development

# BUILD-AHEAD ONLY. Tests and artifacts are not authority to merge, deploy,
# publish Pages, change Stage A, or promote the next certification phase.
on:
  pull_request:
    paths:
      - 'frontend/src/App.tsx'
      - 'frontend/src/components/OceanGlobe.tsx'
      - 'frontend/e2e/mpr-default-verified-argo-5907092.spec.ts'
      - 'scripts/itm_phase_queue.py'
      - 'tests/test_itm_phase_queue.py'
      - 'docs/integration/ITM_05_15_BUILD_QUEUE.json'
      - '.github/workflows/itm-build-queue-development.yml'
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  pull-requests: read

concurrency:
  group: itm-build-ahead-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  itm-queue-contract:
    name: itm05-15-queue-contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate fail-closed sequential phase graph
        run: python scripts/itm_phase_queue.py validate
      - name: Run phase-gating security regression tests
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_itm_phase_queue.py
      - name: Generate unapplied phase queue plan
        run: python scripts/itm_phase_queue.py plan --output itm-build-ahead-plan.json
      - name: Publish preflight report without claiming certification
        uses: actions/upload-artifact@v4
        with:
          name: itm-build-ahead-queue-${{ github.sha }}
          path: itm-build-ahead-plan.json
          if-no-files-found: error
          retention-days: 30

  itm-argo-compile:
    name: itm05-argo-typecheck-build-and-playwright-discovery
    needs: itm-queue-contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked React/Cesium dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck actual Argo integration
        working-directory: frontend
        run: npm run typecheck
      - name: Compile production React/Cesium bundle
        working-directory: frontend
        run: npm run build
      - name: Prove Playwright can discover all Argo cases without a live URL
        working-directory: frontend
        run: |
          unset OCEANTWIN_LIVE_URL
          npm run e2e:live -- --list > /tmp/itm-argo-list.txt
          grep 'mpr-default-verified-argo-5907092.spec.ts' /tmp/itm-argo-list.txt
          test "$(grep -c 'mpr-default-verified-argo-5907092.spec.ts:' /tmp/itm-argo-list.txt)" -eq 4
      # Real Chromium execution is performed by existing MPR/final-mvp
      # candidate workflows; this discovery job does NOT certify rendered UI.

  itm-pr-collision-snapshot:
    name: itm07-live-collision-audit-read-only
    needs: itm-queue-contract
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch exact main, Stage A and integration PR refs (read-only)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/itm_phase_queue.py snapshot --output itm-collision-snapshot.json
      - name: Persist live conflict evidence for future phase gates
        uses: actions/upload-artifact@v4
        with:
          name: itm-readonly-collisions-${{ github.sha }}
          path: itm-collision-snapshot.json
          if-no-files-found: error
          retention-days: 30

  itm-handoff:
    name: itm08-15-build-artifacts-staged-no-release
    needs: [itm-queue-contract, itm-argo-compile, itm-pr-collision-snapshot]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Explicitly keep release blocked
        run: |
          echo 'ITM-05–15 DEVELOPMENT BUILD ONLY'
          echo 'Release, Stage B, Pages, and full Chromium remain separately gated.'
          echo 'No merge or deployment action exists in this workflow.'
