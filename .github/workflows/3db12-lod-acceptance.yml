name: 3db12-native-lod-acceptance

on:
  push:
    branches: [3db-12-block-performance-lod]
  pull_request:
    paths:
      - "frontend/src/main-block-lod.ts"
      - "frontend/src/components/OceanGlobe.tsx"
      - "frontend/src/components/WaterColumn3D.tsx"
      - "frontend/src/api.ts"
      - "frontend/e2e/3db12-performance-lod.spec.ts"
      - "tests/test_3db12_performance_lod.py"
      - ".github/workflows/3db12-lod-acceptance.yml"

jobs:
  native-source-lod:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install scientific test runner
        run: python -m pip install pytest
      - name: Verify all retained genuine 3DB-11 payload digests
        run: python -m pytest -q tests/test_3db12_performance_lod.py
      - name: Install static scientific export dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Produce actual local static baseline (no fabricated data)
        run: python scripts/export_static_science.py --output frontend/public/science-static
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frozen frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck scientific runtime and LOD tests
        working-directory: frontend
        run: npm run typecheck
      - name: Build source-backed static frontend
        working-directory: frontend
        env:
          VITE_STATIC_SCIENCE: "true"
        run: npm run build
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start local production preview
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/ocean-preview.log 2>&1 &
          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/ocean-preview.log; exit 1; fi
      - name: Verify exact native-depth LOD + live Water Column in Chromium
        working-directory: frontend
        env:
          OCEANTWIN_LIVE_URL: "http://127.0.0.1:4173/#/explore"
        run: npx playwright test -c playwright.live.config.ts e2e/3db12-performance-lod.spec.ts
