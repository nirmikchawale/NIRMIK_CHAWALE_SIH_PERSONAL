name: phase35a-live-acceptance-patch2

on:
  push:
    branches:
      - fix/phase-35a-live-acceptance
    paths:
      - tools/phase35a_live_acceptance_patch2.py
      - .github/workflows/phase35a-live-acceptance-patch2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: fix/phase-35a-live-acceptance
          fetch-depth: 0

      - name: Patch remaining live acceptance expectations
        run: python tools/phase35a_live_acceptance_patch2.py

      - name: Commit patched browser acceptance
        shell: bash
        run: |
          if git diff --quiet -- frontend/e2e/live.spec.ts; then
            echo "No patch changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/e2e/live.spec.ts
          git commit -m "test: align remaining live acceptance with current UI"
          git push origin HEAD:fix/phase-35a-live-acceptance
